name: ClawHub

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the package without publishing
        required: false
        type: boolean
        default: false
      source_ref:
        description: Exact commit to package; defaults to the dispatched ref
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: clawhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: tempoxyz/gh-actions/vendor/pnpm/action-setup@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          version: 11.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build npm tarball
        run: |
          mkdir -p artifacts
          pnpm pack --pack-destination artifacts
      - name: Verify runtime output
        run: |
          archive="$(find artifacts -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$archive"
          tar -tzf "$archive" | grep -qx 'package/dist/index.js'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-mpp-clawpack
          path: artifacts/*.tgz
          if-no-files-found: error

  publish:
    name: Publish package
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # Download the package artifact from this workflow run.
      contents: read # Check out this repository and the pinned ClawHub source.
      id-token: write # Authenticate trusted publishes and bind source provenance.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: ./.github/actions/clawhub-package-publish
        with:
          package_artifact_name: openclaw-mpp-clawpack
          dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
