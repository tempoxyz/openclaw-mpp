minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # mppx 0.12.0 requires viem >=2.57.1; both releases are newer than the release-age window.
  - mppx@0.12.0
  - viem@2.57.1
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing host pin predates this policy and was published without provenance.
  - openclaw@2026.7.1-2
  - '@openclaw/ai@2026.7.1-2'

allowBuilds:
  '@google/genai': true
  openclaw: true
  protobufjs: true
  tree-sitter-bash: true

overrides:
  '@hono/node-server@<2.0.5': '2.0.11'
  # The pinned OpenClaw host requires SDK 1.29.0; newer hosts omit runtime-fetch types.
  # Remove once a compatible host release requires SDK >=1.32.0.
  '@modelcontextprotocol/sdk@>=1.0.0 <1.32.0': '1.32.0'
  '@toon-format/toon@<2.3.1': '2.3.1'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'hono@<4.13.11': '4.13.11'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'qs@<6.16.0': '6.16.0'
  tar@<=7.5.20: '7.5.21'
  # OpenClaw pins 8.5.0; newer hosts omit the runtime-fetch types this plugin uses.
  # Remove once a compatible host release pins a fixed undici version.
  'undici@>=8.0.0 <8.10.2': '8.10.2'
